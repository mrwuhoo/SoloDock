<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoloDock 提醒</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./notification.css" />
  </head>
  <body>
    <!-- 统一提醒：菜单栏下方的冰蓝玻璃卡片。上半部分点击打开对应位置，下面一行是按类型给出的按钮。 -->
    <main id="notification-root" class="notification-root" hidden>
      <div class="notification-card">
        <div id="notification-shell" class="notification-shell" role="alert" aria-live="polite" aria-atomic="true">
          <span class="notification-sheen" aria-hidden="true"></span>
          <button id="notification-body" class="notification-body" type="button" aria-label="打开对应位置">
            <span class="notification-icon" aria-hidden="true">
              <svg class="notification-glyph" data-glyph="check" viewBox="0 0 24 24"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg>
              <svg class="notification-glyph" data-glyph="spark" viewBox="0 0 24 24"><path d="M12 3.5c.7 4 2.8 6.1 6.8 6.8-4 .7-6.1 2.8-6.8 6.8-.7-4-2.8-6.1-6.8-6.8 4-.7 6.1-2.8 6.8-6.8Z"/><path d="M18.5 16.5c.25 1.35.95 2.05 2.3 2.3-1.35.25-2.05.95-2.3 2.3-.25-1.35-.95-2.05-2.3-2.3 1.35-.25 2.05-.95 2.3-2.3Z"/></svg>
              <svg class="notification-glyph" data-glyph="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 7.8v4.7l3.2 1.8"/></svg>
              <svg class="notification-glyph" data-glyph="timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="6.8"/><path d="M12 13.5V10M10 3.8h4M17.6 7.4l1.3-1.3"/></svg>
              <svg class="notification-glyph" data-glyph="leaf" viewBox="0 0 24 24"><path d="M5.5 18.5c0-7.5 5-12 13-12 0 8-4.5 13-12 13Z"/><path d="M5.5 18.5 13 11"/></svg>
              <svg class="notification-glyph" data-glyph="calendar" viewBox="0 0 24 24"><rect x="4.5" y="5.5" width="15" height="14" rx="3"/><path d="M4.5 10h15M9 3.5v4M15 3.5v4"/></svg>
              <svg class="notification-glyph" data-glyph="bell" viewBox="0 0 24 24"><path d="M7 16.5V11a5 5 0 0 1 10 0v5.5l1.5 1.5h-13Z"/><path d="M10.2 20.2a2 2 0 0 0 3.6 0"/></svg>
              <svg class="notification-glyph" data-glyph="walk" viewBox="0 0 24 24"><circle cx="13" cy="4.8" r="1.8"/><path d="m10 21 2.3-6.2 2.7 2.4V21M8 12.5l2.4-4.3 3.6 1.2 2 3.3M12.3 14.8 11 9.5"/></svg>
              <svg class="notification-glyph" data-glyph="eye" viewBox="0 0 24 24"><path d="M2.8 12s3.4-6 9.2-6 9.2 6 9.2 6-3.4 6-9.2 6-9.2-6-9.2-6Z"/><circle cx="12" cy="12" r="2.8"/></svg>
              <svg class="notification-glyph" data-glyph="moon" viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5Z"/></svg>
              <svg class="notification-glyph" data-glyph="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8h.01"/></svg>
              <svg class="notification-ring" viewBox="0 0 36 36"><circle class="notification-ring-track" cx="18" cy="18" r="15.5"/><circle class="notification-ring-progress" cx="18" cy="18" r="15.5"/></svg>
              <span id="notification-countdown" class="notification-countdown"></span>
            </span>
            <span class="notification-copy">
              <span class="notification-overline">
                <b id="notification-source" class="notification-source">专注</b>
                <span id="notification-queue" class="notification-queue">刚刚</span>
              </span>
              <span id="notification-title" class="notification-title">任务已完成</span>
              <span id="notification-detail" class="notification-detail">任务已完成，可以查看了</span>
            </span>
          </button>
          <div id="notification-actions" class="notification-actions" role="group" aria-label="提醒操作" hidden></div>
        </div>
        <span class="notification-stack" aria-hidden="true"></span>
      </div>
    </main>

    <script src="./notification.js" defer></script>
  </body>
</html>
