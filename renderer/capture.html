<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SoloDock 随手记</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./capture.css" />
  </head>
  <body>
    <!-- 随手记：在任何应用里按快捷键弹出，记一条就走。上面写，下面是类型、存到哪里和「存入」。 -->
    <main class="capture-root" id="capture-root">
      <form class="capture-card" id="capture-card" autocomplete="off">
        <span class="capture-sheen" aria-hidden="true"></span>
        <div class="capture-main">
          <span class="capture-glyph" id="capture-glyph" aria-hidden="true">
            <svg data-glyph="note" viewBox="0 0 24 24"><path d="M5 19h3.8L19.2 8.6a2.1 2.1 0 0 0-3-3L5.8 16v3Z"/><path d="m14.6 7.4 2.3 2.3"/></svg>
            <svg data-glyph="todo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.8"/><path d="m8.6 12.2 2.3 2.3 4.6-4.8"/></svg>
            <svg data-glyph="link" viewBox="0 0 24 24"><path d="M10.2 13.8a3.8 3.8 0 0 0 5.4 0l2.9-2.9a3.8 3.8 0 0 0-5.4-5.4l-1.3 1.3"/><path d="M13.8 10.2a3.8 3.8 0 0 0-5.4 0l-2.9 2.9a3.8 3.8 0 0 0 5.4 5.4l1.3-1.3"/></svg>
            <!-- 生活：用这个习惯自己的图标（与生活页一致）。 -->
            <svg data-life="run" viewBox="0 0 24 24"><circle cx="13" cy="4.8" r="1.8"/><path d="m10 21 2.3-6.2 2.7 2.4V21M8 12.5l2.4-4.3 3.6 1.2 2 3.3M12.3 14.8 11 9.5"/></svg>
            <svg data-life="lotus" viewBox="0 0 24 24"><path d="M12 19c-4 0-7-2.2-7-5 2 0 4 .8 5 2 0-3 1-6 2-8 1 2 2 5 2 8 1-1.2 3-2 5-2 0 2.8-3 5-7 5Z"/></svg>
            <svg data-life="book" viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5Z"/><path d="M12 6v13.5"/></svg>
            <svg data-life="moon" viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5Z"/></svg>
            <svg data-life="drop" viewBox="0 0 24 24"><path d="M12 3.5c3 4 5.5 7 5.5 10a5.5 5.5 0 0 1-11 0c0-3 2.5-6 5.5-10Z"/></svg>
            <svg data-life="leaf" viewBox="0 0 24 24"><path d="M5.5 18.5c0-7.5 5-12 13-12 0 8-4.5 13-12 13Z"/><path d="M5.5 18.5 13 11"/></svg>
          </span>
          <textarea
            id="capture-input"
            rows="1"
            maxlength="4000"
            placeholder="记一笔：想法、待办、链接，或「跑步 30分钟」"
            aria-label="随手记"
            spellcheck="false"
          ></textarea>
        </div>
        <div class="capture-bar">
          <div class="capture-types" id="capture-types" role="tablist" aria-label="类型（⇥ 切换）">
            <button type="button" role="tab" data-type="note" tabindex="-1">随笔</button>
            <button type="button" role="tab" data-type="todo" tabindex="-1">待办</button>
            <button type="button" role="tab" data-type="link" tabindex="-1">链接</button>
            <button type="button" role="tab" data-type="life" tabindex="-1">生活</button>
          </div>
          <button type="button" class="capture-target" id="capture-target" tabindex="-1">
            <i class="capture-dot" id="capture-dot"></i>
            <span id="capture-target-text"></span>
          </button>
          <button type="submit" class="capture-save" id="capture-save" tabindex="-1">存入<kbd>↩</kbd></button>
        </div>
      </form>
    </main>

    <script src="./life-domain.js"></script>
    <script src="./capture-domain.js"></script>
    <script src="./capture.js"></script>
  </body>
</html>
